name: arcade
description: "Create stunning user interfaces with beautifully crafted Flutter widgets."
publish_to: "none"
homepage: "https://arcade.medz.dev"
repository: https://github.com/medz/flutter-arcade-ui

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  unrouter: ^0.14.0
  flutter_markdown_plus: ^1.0.12
  url_launcher: ^6.3.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  leak_tracker_flutter_testing: ^3.0.10

flutter:
  uses-material-design: true
  assets:
    - lib/widgets/backgrounds/
    - lib/widgets/navigations/
    - lib/widgets/borders/
    - lib/widgets/cards/
    - lib/widgets/games/
    - docs/
    - docs/widgets/backgrounds/
    - docs/widgets/navigations/
    - docs/widgets/borders/
    - docs/widgets/cards/
    - docs/widgets/games/
